<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barangay Outreach Tracker</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%228%22%20fill%3D%22%23172438%22%2F%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%23a7edd7%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%3E%3Crect%20x%3D%227%22%20y%3D%229%22%20width%3D%2218%22%20height%3D%2216%22%20rx%3D%223%22%2F%3E%3Cpath%20d%3D%22M7%2014h18M12%207v4m8-4v4m-7%209%202%202%204-4%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<link rel="stylesheet" href="/style.css">
<main>
  <header>
    <h1>Barangay Outreach</h1>
  </header>
  <div class="csv-actions" role="group" aria-label="Tracker CSV actions">
    <details id="export-as" class="export-menu">
      <summary>Export as</summary>
      <div class="export-options" role="group" aria-label="Export options">
        <button id="snapshot" type="button">Export all</button>
        <button id="export-text" type="button">Text JSON</button>
        <button id="export-csv" type="button">CSV for Sheets</button>
      </div>
    </details>
    <button id="import" type="button">Import CSV</button>
    <span id="snapshot-message" role="status"></span>
  </div>
  <div class="tabs" role="tablist" aria-label="Outreach views">
    <button id="meetings" type="button" role="tab" aria-selected="true" aria-controls="outreach-panel">Meetings</button>
    <button id="barangays" type="button" role="tab" aria-selected="false" aria-controls="outreach-panel" tabindex="-1">Barangay status</button>
    <button id="dashboard" type="button" role="tab" aria-selected="false" aria-controls="dashboard-panel" tabindex="-1">Dashboard</button>
  </div>
  <section class="glass workspace" aria-label="Outreach records">
    <div class="toolbar">
      <input id="search" type="search" aria-label="Search records" placeholder="Search barangays">
      <select id="filter" aria-label="Filter records"></select>
      <select id="meeting-day" aria-label="Filter by day">
        <option value="">All days</option>
        <option value="today">Today</option>
        <option>Monday</option>
        <option>Tuesday</option>
        <option>Wednesday</option>
        <option>Thursday</option>
        <option>Friday</option>
        <option>Saturday</option>
        <option>Sunday</option>
      </select>
      <label id="meeting-date-filter">Date <input id="meeting-date" type="date"></label>
      <button id="email-selection" type="button" aria-pressed="false" hidden>Email draft</button>
      <button id="add" class="primary" type="button">+ Add meeting</button>
    </div>
    <div id="outreach-panel" role="tabpanel" aria-labelledby="meetings">
      <p id="message" role="status"></p>
      <div class="table-wrap" tabindex="0" aria-label="Records table"><table><thead></thead><tbody></tbody></table></div>
    </div>
    <div id="dashboard-panel" role="tabpanel" aria-labelledby="dashboard" hidden>
      <section id="summary" class="summary" aria-label="Outreach totals"></section>
      <div class="dashboard-charts">
        <section class="outreach-chart">
          <h2>Barangay outreach status</h2>
          <fieldset id="outreach-chart-filter" aria-label="Outreach chart filters">
            <label><input type="checkbox" value="Email sent" checked> Emailed</label>
            <label><input type="checkbox" value="isTextSent" checked> Texted</label>
            <label><input type="checkbox" value="isreplied" checked> Replied by text</label>
            <label><input type="checkbox" value="isMeeting" checked> Has meeting</label>
          </fieldset>
          <div class="pie-layout">
            <div id="outreach-rings" aria-hidden="true"></div>
            <ul id="outreach-chart-legend"></ul>
          </div>
        </section>
        <section class="daily-chart">
          <h2>Meetings per day</h2>
          <p class="chart-note"><span style="color: #315d43">● Complete</span> · <span style="color: #7956a0">● Scheduled</span></p>
          <ul id="daily-meetings"></ul>
        </section>
        <section class="meeting-status-chart">
          <h2>Barangays by meeting status</h2>
          <div class="pie-layout">
            <div id="status-pie" aria-hidden="true"></div>
            <ul id="status-legend"></ul>
          </div>
        </section>
      </div>
    </div>
  </section>
  <footer>Changes are saved to local CSV files on this laptop.</footer>
</main>
<div id="email-actions" class="actions" hidden>
  <span id="email-selection-status" role="status"></span>
  <button id="email-select-all" type="button">Select all shown</button>
  <button id="email-cancel" type="button">Cancel</button>
  <button id="email-confirm" class="primary" type="button" disabled>Confirm</button>
</div>
<dialog id="email-draft" aria-labelledby="email-draft-title">
  <h2 id="email-draft-title">Meeting email draft</h2>
  <label>BCC <textarea id="draft-bcc" rows="2" readonly></textarea></label>
  <label>Message <textarea id="draft-message" rows="14"></textarea></label>
  <p id="draft-status" role="status"></p>
  <form method="dialog" class="actions">
    <button>Close</button>
    <button id="copy-bcc" type="button">Copy BCC</button>
    <button id="copy-message" class="primary" type="button">Copy message</button>
  </form>
</dialog>
<div id="day-card" class="glass" popover aria-label="Meetings breakdown"></div>
<dialog id="editor">
  <form id="form">
    <h2 id="editor-title"></h2>
    <div id="fields"></div>
    <p id="error" role="alert"></p>
    <div class="actions">
      <button id="cancel" type="button">Cancel</button>
      <button class="primary" type="submit">Save changes</button>
    </div>
  </form>
</dialog>
<script src="/app.js" defer></script>
</html>
